[package]
name = "qubit-json-jcs-feature-unification"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = []
arbitrary_precision = ["serde_json/arbitrary_precision"]
preserve_order = ["serde_json/preserve_order"]
jcs = ["qubit-json/jcs"]

[dependencies]
qubit-json = { path = "../../.." }
qubit-budget = { version = "^0.10", features = ["json"] }
serde = "1.0"
serde_json = "1.0"

