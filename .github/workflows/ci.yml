name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  rust-ci:
    uses: qubit-ltd/rs-ci/.github/workflows/rust-ci.yml@main
    with:
      coverage_enforce_thresholds: "1"
    secrets: inherit

  serde-json-minimum:
    name: serde_json compatibility (minimum 1.0.151)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Resolve and install Rust build toolchain
        shell: bash
        run: |
          source .rs-ci/toolchains.sh
          configure_rs_ci_toolchains
          echo "RS_CI_BUILD_TOOLCHAIN=$RS_CI_BUILD_TOOLCHAIN" >> "$GITHUB_ENV"
          rustup toolchain install "$RS_CI_BUILD_TOOLCHAIN" --profile minimal

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-serde-json-minimum-${{ hashFiles('Cargo.toml') }}

      - name: Resolve minimum serde_json version
        shell: bash
        run: |
          cargo +"$RS_CI_BUILD_TOOLCHAIN" update -p serde_json --precise 1.0.151
          RESOLVED_VERSION=$(
            cargo +"$RS_CI_BUILD_TOOLCHAIN" metadata --locked --format-version 1 |
              jq -r '.packages[] | select(.name == "serde_json") | .version'
          )
          if [ "$RESOLVED_VERSION" != "1.0.151" ]; then
            echo "error: expected serde_json 1.0.151, resolved $RESOLVED_VERSION" >&2
            exit 1
          fi

      - name: Test minimum serde_json version
        run: cargo +"$RS_CI_BUILD_TOOLCHAIN" test --locked --all-features

  serde-json-latest:
    name: serde_json compatibility (latest allowed)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Resolve and install Rust build toolchain
        shell: bash
        run: |
          source .rs-ci/toolchains.sh
          configure_rs_ci_toolchains
          echo "RS_CI_BUILD_TOOLCHAIN=$RS_CI_BUILD_TOOLCHAIN" >> "$GITHUB_ENV"
          rustup toolchain install "$RS_CI_BUILD_TOOLCHAIN" --profile minimal

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-serde-json-latest-${{ hashFiles('Cargo.toml') }}

      - name: Resolve latest allowed serde_json version
        shell: bash
        run: |
          cargo +"$RS_CI_BUILD_TOOLCHAIN" update -p serde_json
          cargo +"$RS_CI_BUILD_TOOLCHAIN" metadata --locked --format-version 1 |
            jq -r '.packages[] | select(.name == "serde_json") | "Resolved serde_json " + .version'

      - name: Test latest allowed serde_json version
        run: cargo +"$RS_CI_BUILD_TOOLCHAIN" test --locked --all-features
