name: Miri

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      - name: Run tree mutator tests under Miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo miri test --test tests tree::json_tree_mutator_tests
