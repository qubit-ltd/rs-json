name: Rust Fuzz

on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  decoder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install Rust nightly
        run: rustup toolchain install nightly-2026-06-05 --profile minimal

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz decoder
        working-directory: fuzz
        run: cargo +nightly-2026-06-05 fuzz run decoder -- -max_total_time=300

      - name: Upload decoder fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: decoder-fuzz-artifacts
          path: fuzz/artifacts/**
          if-no-files-found: warn
          retention-days: 14
