[package]
name = "qubit-json"
version = "0.7.0"
edition = "2024"
rust-version = "1.94"
autotests = false
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-json"
description = "Lenient JSON decoder for non-fully-trusted JSON text inputs"
homepage = "https://github.com/qubit-ltd/rs-json"
documentation = "https://docs.rs/qubit-json"
readme = "README.md"
keywords = ["json", "decoder", "serde", "lenient", "qubit"]
categories = ["encoding", "parser-implementations"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/**",
    "/tests/**",
    "/benches/**",
    "/.github/workflows/ci.yml",
    "/.github/workflows/fuzz.yml",
]

[package.metadata.rs-ci]
package-include-extra = [
    "/.github/workflows/ci.yml",
    "/.github/workflows/fuzz.yml",
]

[lib]
name = "qubit_json"
doctest = true

[[test]]
name = "tests"
path = "tests/mod.rs"

[dependencies]
qubit-budget = { version = "0.4", path = "../rs-budget", features = ["json"] }
serde = "1.0"
serde_json = { version = "1.0", features = ["arbitrary_precision", "float_roundtrip", "raw_value"] }
thiserror = "2.0"

[dev-dependencies]
criterion = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "decoder_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
