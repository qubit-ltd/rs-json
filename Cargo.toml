[package]
name = "qubit-json"
version = "0.8.0"
edition = "2024"
rust-version = "1.94"
autotests = false
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-json"
description = "Resource-aware infrastructure for lenient and strict JSON processing"
homepage = "https://github.com/qubit-ltd/rs-json"
documentation = "https://docs.rs/qubit-json"
readme = "README.md"
keywords = ["json", "serde", "decoder", "budget", "qubit"]
categories = ["encoding", "parser-implementations"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/**",
    "/tests/**",
    "/benches/**",
    "/.github/workflows/ci.yml",
    "/.github/workflows/fuzz.yml",
]

[package.metadata.rs-ci]
package-include-extra = [
    "/.github/workflows/ci.yml",
    "/.github/workflows/fuzz.yml",
]

[lib]
name = "qubit_json"
doctest = true

[[test]]
name = "tests"
path = "tests/mod.rs"

[dependencies]
serde = "1.0"
# encode/serde_compat relies on serde_json's private RawValue protocol. See
# doc/dependency_maintenance.zh_CN.md before upgrading this dependency.
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "raw_value"] }
thiserror = "2.0"

qubit-budget = { version = "0.3", features = ["json"] }

[dev-dependencies]
criterion = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "decoder_bench"
harness = false

[[bench]]
name = "budgeted_serde_json"
harness = false

[[bench]]
name = "tree_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
