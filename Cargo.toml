[package]
name = "qubit-json"
version = "0.12.0"
edition = "2024"
rust-version = "1.94"
autotests = false
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-json"
description = "Resource-aware infrastructure for lenient and strict JSON processing"
homepage = "https://github.com/qubit-ltd/rs-json"
documentation = "https://docs.rs/qubit-json"
readme = "README.md"
keywords = ["json", "serde", "decoder", "budget", "qubit"]
categories = ["encoding", "parser-implementations"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/**",
    "/tests/**",
    "/benches/**",
    "/.github/workflows/ci.yml",
    "/.github/workflows/fuzz.yml",
]

[package.metadata.rs-infra]
miri = true
miri-test-args = ["--test", "tests", "value::traverse::json_tree_mutator_tests"]
package-include-extra = [
    "/.github/workflows/ci.yml",
    "/.github/workflows/fuzz.yml",
]

[lib]
name = "qubit_json"
doctest = true

[features]
jcs = ["dep:serde_json_canonicalizer"]
jcs-allocation-diagnostics = []

[[test]]
name = "tests"
path = "tests/mod.rs"

[dependencies]
serde = "^1.0"
serde_json = { version = "^1.0", features = ["float_roundtrip", "raw_value"] }
thiserror = "^2.0"

qubit-budget = { path = "../rs-budget", version = "0.9", features = ["json"] }
qubit-io = { path = "../rs-io", version = "0.19" }
serde_json_canonicalizer = { version = "^0.4", optional = true }

[dev-dependencies]
criterion = "^0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "decoder_bench"
harness = false

[[bench]]
name = "budgeted_serde_json"
harness = false

[[bench]]
name = "tree_bench"
harness = false

[[bench]]
name = "jcs_bench"
harness = false
required-features = ["jcs"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
