[package]
name = "qubit-json-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
qubit-budget = { path = "../../rs-budget", features = ["json"] }
qubit-json = { path = ".." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "decoder"
path = "fuzz_targets/decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_decode_differential"
path = "fuzz_targets/json_decode_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_budget_invariants"
path = "fuzz_targets/json_budget_invariants.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_encode_invariants"
path = "fuzz_targets/json_encode_invariants.rs"
test = false
doc = false
bench = false
