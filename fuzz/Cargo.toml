[package]
name = "qubit-json-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
libfuzzer-sys = "^0.4"
qubit-budget = { version = "0.9", features = ["json"] }

qubit-json = { path = "..", features = ["jcs"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_json_canonicalizer = "^0.4"

[[bin]]
name = "decoder"
path = "fuzz_targets/decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_decode_differential"
path = "fuzz_targets/json_decode_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_budget_invariants"
path = "fuzz_targets/json_budget_invariants.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_encode_invariants"
path = "fuzz_targets/json_encode_invariants.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_tree_invariants"
path = "fuzz_targets/json_tree_invariants.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jcs_invariants"
path = "fuzz_targets/jcs_invariants.rs"
test = false
doc = false
bench = false
